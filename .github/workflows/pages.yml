name: Deploy landing page to GitHub Pages
# Publishes the cinematic landing page (with the simulation engine running in the
# visitor's browser) as a static site. The full application needs the API,
# database and worker, so on this site its links open the setup guide instead.
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - id: pages
        uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Build static landing page
        working-directory: apps/web
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: pnpm build:static && touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/web/out }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
